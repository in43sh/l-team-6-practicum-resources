<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sonix — Architecture Map</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141d;
    --panel-2: #1b1b27;
    --border: #2a2a3a;
    --text: #e6e6f0;
    --muted: #8a8aa0;
    --faint: #3a3a4d;
    --accent: #7c5cfc;
    --shadow: rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* ---- Side rail ---- */
  .rail {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .rail header { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
  .rail header h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  .rail header p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .rail .scroll { overflow-y: auto; padding: 14px 12px; flex: 1; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 4px 6px 8px; }

  .flow-item {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .flow-item:hover { border-color: var(--accent); }
  .flow-item:active { transform: translateY(1px); }
  .flow-item.active { border-color: var(--accent); background: #221c3d; box-shadow: 0 0 0 1px var(--accent) inset; }
  .flow-item .fname { font-weight: 600; }
  .flow-item .fdesc { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .controls { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }

  .legend { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend .dot { width: 11px; height: 11px; border-radius: 3px; }

  /* ---- Steps panel (collapsible bottom of rail) ---- */
  .steps { border-top: 1px solid var(--border); max-height: 38%; overflow-y: auto; padding: 12px; display: none; }
  .steps.show { display: block; }
  .steps h2 { font-size: 13px; margin: 0 0 10px; }
  .step { display: flex; gap: 10px; margin-bottom: 9px; }
  .step .num {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step .body { font-size: 12px; }
  .step .hop { color: var(--text); }
  .step .hop b { color: #c9bcff; font-weight: 600; }
  .step .lbl { color: var(--text); }
  .step .det { color: var(--muted); margin-top: 2px; }

  /* ---- Stage ---- */
  .stage { position: relative; overflow: auto; padding: 28px; }
  .stage-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .stage-head h2 { margin: 0; font-size: 16px; }
  .stage-head .desc { color: var(--muted); font-size: 13px; }
  .columns { display: flex; gap: 56px; align-items: flex-start; position: relative; z-index: 2; min-width: max-content; }
  .col { display: flex; flex-direction: column; gap: 16px; width: 220px; }
  .col > .col-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 6px; border-bottom: 2px solid; }

  .node {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--faint);
    border-radius: 9px;
    padding: 10px 12px;
    transition: opacity .18s, box-shadow .18s, transform .08s, border-color .18s;
    position: relative;
  }
  .node .label { font-weight: 600; font-size: 13px; }
  .node .path { color: var(--muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 3px; word-break: break-all; }
  .node .detail { color: var(--muted); font-size: 11.5px; margin-top: 5px; }
  .node .badge {
    position: absolute; top: -10px; left: -10px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px var(--shadow); z-index: 5;
  }
  .node.dim { opacity: .22; }
  .node.hot { box-shadow: 0 0 0 2px var(--accent), 0 6px 20px rgba(124,92,252,.25); border-left-color: var(--accent); }
  .node.hot .badge { display: flex; }

  /* SVG overlay for connectors */
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
  .stage-inner { position: relative; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <header>
      <h1 id="proj-name">Sonix</h1>
      <p id="proj-desc"></p>
    </header>
    <div class="scroll">
      <div class="section-label">Flows</div>
      <div id="flows"></div>
    </div>
    <div class="controls">
      <button class="btn" id="clear-btn">Clear selection</button>
    </div>
    <div class="steps" id="steps">
      <h2 id="steps-title"></h2>
      <div id="steps-list"></div>
    </div>
    <div class="legend" id="legend"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-head">
      <h2 id="flow-title">Static architecture</h2>
      <span class="desc" id="flow-desc">All components and their connections. Pick a flow to trace a path.</span>
    </div>
    <div class="stage-inner" id="stage-inner">
      <svg class="wires" id="wires"></svg>
      <div class="columns" id="columns"></div>
    </div>
  </main>
</div>

};

const DEFAULT_FLOW = "play-visualizer";

/* ============================================================
   Rendering
   ============================================================ */
const nodeById = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const catById = Object.fromEntries(DATA.categories.map(c => [c.id, c]));
const nodeEls = {};
let activeFlowId = null;

document.getElementById("proj-name").textContent = DATA.name;
document.getElementById("proj-desc").textContent = DATA.description;

/* ---- Columns + nodes ---- */
const columnsEl = document.getElementById("columns");
DATA.categories.forEach(cat => {
  const col = document.createElement("div");
  col.className = "col";
  const title = document.createElement("div");
  title.className = "col-title";
  title.textContent = cat.label;
  title.style.color = cat.color;
  title.style.borderBottomColor = cat.color;
  col.appendChild(title);

  DATA.nodes.filter(n => n.category === cat.id).forEach(n => {
    const el = document.createElement("div");
    el.className = "node";
    el.style.borderLeftColor = cat.color;
    el.dataset.id = n.id;

    const badge = document.createElement("div");
    badge.className = "badge";
    el.appendChild(badge);

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = n.label;
    el.appendChild(label);

    if (n.path) {
      const p = document.createElement("div");
      p.className = "path";
      p.textContent = n.path;
      el.appendChild(p);
    }
    if (n.detail) {
      const d = document.createElement("div");
      d.className = "detail";
      d.textContent = n.detail;
      el.appendChild(d);
    }
    col.appendChild(el);
    nodeEls[n.id] = el;
  });
  columnsEl.appendChild(col);
});

/* ---- Legend ---- */
const legendEl = document.getElementById("legend");
DATA.categories.forEach(cat => {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.label}`;
  legendEl.appendChild(item);
});

/* ---- Flow rail ---- */
const flowsEl = document.getElementById("flows");
DATA.flows.forEach(flow => {
  const item = document.createElement("div");
  item.className = "flow-item";
  item.dataset.flow = flow.id;
  item.innerHTML = `<div class="fname">${flow.name}</div><div class="fdesc">${flow.description}</div>`;
  item.addEventListener("click", () => selectFlow(flow.id));
  flowsEl.appendChild(item);
});

document.getElementById("clear-btn").addEventListener("click", clearSelection);

/* ============================================================
   SVG wiring
   ============================================================ */
const svg = document.getElementById("wires");
const SVGNS = "http://www.w3.org/2000/svg";

function ensureDefs() {
  if (svg.querySelector("defs")) return;
  const defs = document.createElementNS(SVGNS, "defs");
  defs.innerHTML = `
    <marker id="arrow-faint" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a3a4d"></path>
    </marker>
    <marker id="arrow-hot" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c5cfc"></path>
    </marker>`;
  svg.appendChild(defs);
}

function centerOf(el, container) {
  const r = el.getBoundingClientRect();
  const c = container.getBoundingClientRect();
  return {
    left: r.left - c.left, right: r.right - c.left,
    top: r.top - c.top, bottom: r.bottom - c.top,
    cx: r.left - c.left + r.width / 2,
    cy: r.top - c.top + r.height / 2,
    w: r.width, h: r.height
  };
}

/* Anchor on the side facing the target, so wires leave/enter cleanly. */
function anchor(a, b) {
  const dx = b.cx - a.cx;
  if (Math.abs(dx) < 8) {
    return a.cy < b.cy ? { x: a.cx, y: a.bottom } : { x: a.cx, y: a.top };
  }
  return dx > 0 ? { x: a.right, y: a.cy } : { x: a.left, y: a.cy };
}

function pathD(p1, p2) {
  const dx = p2.x - p1.x;
  const c = Math.max(28, Math.abs(dx) * 0.45);
  // horizontal-biased cubic bezier
  const c1x = p1.x + (dx >= 0 ? c : -c);
  const c2x = p2.x - (dx >= 0 ? c : -c);
  return `M ${p1.x},${p1.y} C ${c1x},${p1.y} ${c2x},${p2.y} ${p2.x},${p2.y}`;
}

function draw() {
  ensureDefs();
  // clear everything except defs
  [...svg.querySelectorAll("path.wire, g.steplabel")].forEach(n => n.remove());
  const container = document.getElementById("stage-inner");
  svg.setAttribute("width", container.scrollWidth);
  svg.setAttribute("height", container.scrollHeight);

  if (activeFlowId) {
    drawFlow(activeFlowId, container);
  } else {
    drawStatic(container);
  }
}

function drawStatic(container) {
  DATA.edges.forEach(e => {
    const a = nodeEls[e.from], b = nodeEls[e.to];
    if (!a || !b) return;
    const ga = centerOf(a, container), gb = centerOf(b, container);
    const p1 = anchor(ga, gb), p2 = anchor(gb, ga);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", pathD(p1, p2));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#2a2a3a");
    path.setAttribute("stroke-width", "1.3");
    path.setAttribute("marker-end", "url(#arrow-faint)");
    svg.appendChild(path);
  });
}

function drawFlow(flowId, container) {
  const flow = DATA.flows.find(f => f.id === flowId);
  if (!flow) return;

  // faint static backdrop
  DATA.edges.forEach(e => {
    const a = nodeEls[e.from], b = nodeEls[e.to];
    if (!a || !b) return;
    const ga = centerOf(a, container), gb = centerOf(b, container);
    const p1 = anchor(ga, gb), p2 = anchor(gb, ga);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", pathD(p1, p2));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#1f1f2b");
    path.setAttribute("stroke-width", "1");
    svg.appendChild(path);
  });

  // highlighted ordered steps
  flow.steps.forEach((step, i) => {
    const a = nodeEls[step.from], b = nodeEls[step.to];
    if (!a || !b) return;
    const ga = centerOf(a, container), gb = centerOf(b, container);
    const p1 = anchor(ga, gb), p2 = anchor(gb, ga);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", pathD(p1, p2));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#7c5cfc");
    path.setAttribute("stroke-width", "2.2");
    path.setAttribute("marker-end", "url(#arrow-hot)");
    path.setAttribute("opacity", "0.95");
    svg.appendChild(path);

    // numbered chip at the midpoint of the connector
    const mx = (p1.x + p2.x) / 2;
    const my = (p1.y + p2.y) / 2;
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "steplabel");
    const circ = document.createElementNS(SVGNS, "circle");
    circ.setAttribute("cx", mx); circ.setAttribute("cy", my); circ.setAttribute("r", "10");
    circ.setAttribute("fill", "#7c5cfc");
    circ.setAttribute("stroke", "#0a0a0f"); circ.setAttribute("stroke-width", "2");
    const txt = document.createElementNS(SVGNS, "text");
    txt.setAttribute("x", mx); txt.setAttribute("y", my + 0.5);
    txt.setAttribute("fill", "#fff"); txt.setAttribute("font-size", "11");
    txt.setAttribute("font-weight", "700");
    txt.setAttribute("text-anchor", "middle"); txt.setAttribute("dominant-baseline", "central");
    txt.textContent = String(i + 1);
    g.appendChild(circ); g.appendChild(txt);
    svg.appendChild(g);
  });
}

/* ============================================================
   Selection state
   ============================================================ */
function selectFlow(flowId) {
  activeFlowId = flowId;
  const flow = DATA.flows.find(f => f.id === flowId);

  // rail active state
  document.querySelectorAll(".flow-item").forEach(el =>
    el.classList.toggle("active", el.dataset.flow === flowId));

  // node highlight: collect ids + first-touch order for badges
  const touched = [];
  flow.steps.forEach(s => { [s.from, s.to].forEach(id => { if (!touched.includes(id)) touched.push(id); }); });

  Object.entries(nodeEls).forEach(([id, el]) => {
    const inFlow = touched.includes(id);
    el.classList.toggle("hot", inFlow);
    el.classList.toggle("dim", !inFlow);
    const badge = el.querySelector(".badge");
    const order = touched.indexOf(id);
    badge.textContent = order >= 0 ? String(order + 1) : "";
  });

  // header
  document.getElementById("flow-title").textContent = flow.name;
  document.getElementById("flow-desc").textContent = flow.description;

  // steps panel
  renderSteps(flow);
  draw();
}

function renderSteps(flow) {
  const panel = document.getElementById("steps");
  panel.classList.add("show");
  document.getElementById("steps-title").textContent = "Steps — " + flow.name;
  const list = document.getElementById("steps-list");
  list.innerHTML = "";
  flow.steps.forEach((s, i) => {
    const from = nodeById[s.from]?.label ?? s.from;
    const to = nodeById[s.to]?.label ?? s.to;
    const row = document.createElement("div");
    row.className = "step";
    row.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="body">
        <div class="hop"><b>${from}</b> → <b>${to}</b></div>
        <div class="lbl">${s.label ?? ""}</div>
        ${s.detail ? `<div class="det">${s.detail}</div>` : ""}
      </div>`;
    list.appendChild(row);
  });
}

function clearSelection() {
  activeFlowId = null;
  document.querySelectorAll(".flow-item").forEach(el => el.classList.remove("active"));
  Object.values(nodeEls).forEach(el => {
    el.classList.remove("hot", "dim");
    el.querySelector(".badge").textContent = "";
  });
  document.getElementById("flow-title").textContent = "Static architecture";
  document.getElementById("flow-desc").textContent =
    "All components and their connections. Pick a flow to trace a path.";
  document.getElementById("steps").classList.remove("show");
  draw();
}

/* ---- Lifecycle ---- */
window.addEventListener("resize", draw);
document.getElementById("stage").addEventListener("scroll", draw);

// initial paint (after layout settles) + default flow
requestAnimationFrame(() => {
  if (DEFAULT_FLOW && DATA.flows.some(f => f.id === DEFAULT_FLOW)) {
    selectFlow(DEFAULT_FLOW);
  } else {
    draw();
  }
});
</script>
</body>
</html>
